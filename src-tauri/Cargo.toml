[package]
name = "hangul-ai-editor"
version = "0.1.0"
description = "AI-assisted editor for Hangul document files"
authors = ["hangle with codex"]
edition = "2021"

[lib]
name = "hangul_ai_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

